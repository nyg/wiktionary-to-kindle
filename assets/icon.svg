<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdfbf7"/>
      <stop offset="1" stop-color="#e8e2d6"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f5d8a"/>
      <stop offset="1" stop-color="#1e3f61"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="200" fill="#16324f"/>

  <!-- Open dictionary: two pages meeting at a spine -->
  <g transform="translate(112 232)">
    <path d="M8 60 Q200 0 384 44 L384 508 Q200 468 8 528 Z" fill="url(#page)"/>
    <path d="M792 60 Q600 0 416 44 L416 508 Q600 468 792 528 Z" fill="url(#page)"/>
    <rect x="384" y="36" width="32" height="480" rx="10" fill="url(#spine)"/>

    <!-- Entry lines, shorter on the right to suggest definitions -->
    <g fill="#8d99a6" opacity="0.85">
      <rect x="72" y="126" width="252" height="20" rx="10"/>
      <rect x="72" y="192" width="196" height="20" rx="10"/>
      <rect x="72" y="258" width="232" height="20" rx="10"/>
      <rect x="72" y="324" width="164" height="20" rx="10"/>

      <rect x="476" y="126" width="232" height="20" rx="10"/>
      <rect x="476" y="192" width="176" height="20" rx="10"/>
      <rect x="476" y="258" width="248" height="20" rx="10"/>
      <rect x="476" y="324" width="140" height="20" rx="10"/>
    </g>
  </g>
</svg>
