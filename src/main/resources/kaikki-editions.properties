# Wiktionary language editions that kaikki.org publishes a full wiktextract dump for.
#
# Data, not code: kaikki adds and drops editions over time, so this can be updated without a
# release. This list is the offline fallback only — KaikkiCatalog fetches the live list from
# kaikki's homepage at startup and caches it, so an edition added after this build still appears
# without anyone editing this file. It is what the dropdown shows when kaikki is unreachable and
# nothing has been cached yet.
#
# Every code below was verified with a HEAD request against
# https://kaikki.org/{code}wiktionary/raw-wiktextract-data.jsonl.gz (English: /dictionary/).
# The dropdown is not editable, so an unserved code here becomes an HTTP 404 the user cannot avoid.
#
# Format: one code per line, in "editions" below. Display names come from
# DictionaryTitles.displayName; add a "name.<code>" entry only where that yields something
# unhelpful, which happens when the code is not a language tag the JDK knows.
editions=\
  cs,\
  de,\
  el,\
  en,\
  es,\
  fr,\
  id,\
  it,\
  ja,\
  ko,\
  ku,\
  ms,\
  nl,\
  pl,\
  pt,\
  ru,\
  simple,\
  th,\
  tr,\
  vi,\
  zh

name.simple=Simple English
