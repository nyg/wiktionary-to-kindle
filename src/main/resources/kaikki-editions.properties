# Wiktionary language editions that kaikki.org publishes a full wiktextract dump for.
#
# Data, not code: kaikki adds and drops editions over time, so this can be updated without a
# release. The list only populates the GUI's edition dropdown as a convenience — any code can still
# be entered by hand, and an edition kaikki does not serve fails fast on the HEAD probe with a
# clear "HTTP 404" message.
#
# Format: one ISO 639-1 code per line, in "editions" below. Display names come from
# DictionaryTitles.displayName, so they are not repeated here.
