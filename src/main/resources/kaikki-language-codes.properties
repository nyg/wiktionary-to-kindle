# Wiktionary language names, as kaikki.org spells them, mapped to the lang_code its dumps carry.
#
# Data, not code. JsonlDictionaryParser filters on an exact lang_code match, so the code here is the
# one the pipeline needs; getting it wrong silently produces an empty dictionary.
#
# Only the names the JDK cannot resolve on its own are listed. LanguageCodeResolver tries this file
# first and falls back to matching against Locale.getDisplayLanguage in the edition's own locale,
# which covers a further 670 names. Two reasons an entry appears here:
#
#   - CLDR has no such name. kaikki lists many languages outside ISO 639-1 (Ancient Greek, Old
#     English, Translingual, Kotava), and spells others its own way ("Bengali" where CLDR says
#     "Bangla", "Weissrussisch" where CLDR says "Belarussisch").
#   - CLDR resolves the name to a different code. Every "Yiddish" entry is here for that reason:
#     Locale.getISOLanguages() still carries the deprecated ji, while kaikki emits yi.
#
# Keys are "<edition>.<name>" with the name lowercased, accents stripped and every character that is
# neither a letter nor a digit removed, matching LanguageCodeResolver.normalise. Letter means letter
# in any script: keys for the non-Latin editions are Chinese, Cyrillic, Japanese, Korean or Thai.
#
# Generated by reading the first JSONL line of each per-language dump at
# https://kaikki.org/{edition}/{Language}/kaikki.org-dictionary-{Language}.jsonl and taking its
# top-level lang_code. All 2081 languages across the 21 editions resolved; the 1103 below are those
# the JDK gets wrong or does not know. Regenerate the same way if kaikki adds editions.

