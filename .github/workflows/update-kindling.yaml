name: Update kindling-cli

on:
  schedule:
    - cron: '17 5 * * 1' # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Regenerate kindling-release.properties
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          json=$(gh api repos/ciscoriordan/kindling/releases/latest)
          tag=$(jq -r '.tag_name' <<< "$json")
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::unexpected tag: $tag"; exit 1; }

          file="# Pinned kindling-cli release (https://github.com/ciscoriordan/kindling)."$'\n'
          file+="# Regenerated by .github/workflows/update-kindling.yaml; do not edit manually."$'\n'
          file+="version=$tag"$'\n'
          for asset in kindling-cli-linux kindling-cli-mac-apple-silicon kindling-cli-mac-intel kindling-cli-windows.exe; do
            digest=$(jq -r --arg name "$asset" '.assets[] | select(.name == $name) | .digest // empty' <<< "$json")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::missing or invalid digest for $asset in $tag"; exit 1; }
            file+="sha256.$asset=${digest#sha256:}"$'\n'
          done

          printf '%s' "$file" > src/main/resources/kindling-release.properties
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@84ae59a2cdc2258d6fa0732dd66352dddae2a412 # v7.0.9
        with:
          token: ${{ secrets.WIKTIONARY_KINDLING }}
          commit-message: 'chore(deps): update kindling-cli to ${{ steps.release.outputs.tag }}'
          branch: nyg/update-kindling
          delete-branch: true
          title: 'chore(deps): update kindling-cli to ${{ steps.release.outputs.tag }}'
          body: |
            Updates the pinned kindling-cli release to
            [${{ steps.release.outputs.tag }}](https://github.com/ciscoriordan/kindling/releases/tag/${{ steps.release.outputs.tag }}).

            Per-platform SHA-256 digests are taken from the GitHub release API `digest`
            field — the same source `KindlingDownloader.resolveDigest()` trusts for
            non-pinned versions. No binaries are downloaded by this workflow.

            Automated by `.github/workflows/update-kindling.yaml`.
