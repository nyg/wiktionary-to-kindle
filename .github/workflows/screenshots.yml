name: Screenshots

# Captures the real main window on macOS for the README. Run it by hand after a UI change and commit the
# PNG from its `screenshots` artifact to assets/screenshots/.

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/screenshots.yml
      - src/test/java/edu/self/w2k/gui/ScreenshotLauncher.java

permissions:
  contents: read

jobs:
  capture:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: 25.0.4+7.0.LTS
          distribution: temurin
          cache: maven

      - name: Build and resolve the classpath
        run: |
          mvn --no-transfer-progress -q -DskipTests test-compile
          mvn --no-transfer-progress -q dependency:build-classpath -Dmdep.includeScope=test -Dmdep.outputFile=cp.txt
          mkdir -p screenshots

      - name: Capture
        run: |
          java -cp "target/test-classes:target/classes:$(cat cp.txt)" edu.self.w2k.gui.ScreenshotLauncher > launcher.log 2>&1 &
          for _ in $(seq 1 120); do grep -q "SCREENSHOT READY" launcher.log && break; sleep 1; done
          cat launcher.log
          sleep 2
          cat > window-id.swift <<'EOF'
          import CoreGraphics
          let windows = CGWindowListCopyWindowInfo([.optionOnScreenOnly], kCGNullWindowID) as! [[String: Any]]
          for window in windows where (window[kCGWindowLayer as String] as? Int) == 0 {
              if (window[kCGWindowOwnerName as String] as? String ?? "").lowercased().contains("java") {
                  print(window[kCGWindowNumber as String] as! Int)
                  break
              }
          }
          EOF
          screencapture -x -l "$(swift window-id.swift)" screenshots/macos.png

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: screenshots
          path: screenshots/
