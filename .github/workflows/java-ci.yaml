name: Java CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # The GUI's FXML load test needs a graphics toolkit, and OpenJFX publishes no Monocle
      # artifacts for this release line, so a virtual display is how it gets exercised here. The
      # test self-skips if the toolkit cannot start, so this never hard-fails the build.
      - run: xvfb-run -a mvn --no-transfer-progress verify

      - run: mvn --no-transfer-progress sonar:sonar
        if: env.SONAR_TOKEN != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Exercises jlink + jpackage on both release platforms. Without this, a broken module list or a
  # packaging regression would stay hidden until someone cut a release — and the failures it catches
  # (a missing JDK module, an unresolvable JavaFX module) never show up in `mvn verify`.
  #
  # The runtime probe inside package.sh is the real assertion: it checks TLS, locale data and the
  # JavaFX modules from inside the freshly linked image.
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            type: dmg
          - os: windows-latest
            type: app-image
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Build JAR
        run: mvn --no-transfer-progress -q -DskipTests package

      - name: Package
        shell: bash
        run: scripts/package.sh ${{ matrix.type }}

      - name: Show output
        shell: bash
        run: ls -la target/dist
